<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login – Manupi</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- KONFIGURASI WARNA MANUPI -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#013a13",
            "primary-container": "#1e5128",
            "on-primary": "#ffffff"
          }
        }
      }
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Custom CSS -->
  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="bg-background text-on-background font-body min-h-screen">
  <div class="max-w-xl mx-auto px-6 py-12">
    <h1 class="text-4xl md:text-5xl font-serif text-primary mb-2">Admin Login</h1>
    <p class="text-sm text-stone-500 mb-8">
      Masukkan <b>Admin ID</b> dan <b>Token</b>. Token disimpan di browser (localStorage) sampai Anda hapus manual.
    </p>

    <div class="rounded-3xl border border-stone-200 bg-white/80 p-6 md:p-8 shadow-sm">
      <div class="space-y-4">
        <!-- Admin ID -->
        <div>
          <label for="admin-id" class="block text-sm font-medium mb-2">Admin ID</label>
          <input id="admin-id" type="text" placeholder="admin1" class="w-full rounded-xl border border-stone-200 bg-white px-4 py-3 text-sm focus:border-emerald-700 focus:ring-0" />
          <p class="text-xs text-stone-500 mt-2">Contoh: admin1 / admin2 / admin3</p>
        </div>

        <!-- Token + Eye Toggle -->
        <div>
          <label for="admin-token" class="block text-sm font-medium mb-2">Token</label>
          <div class="relative">
            <input id="admin-token" type="password" placeholder="Masukkan token..." class="w-full rounded-xl border border-stone-200 bg-white px-4 py-3 pr-12 text-sm focus:border-emerald-700 focus:ring-0" />
            <button id="toggle-token-visibility" type="button" class="absolute inset-y-0 right-0 flex items-center justify-center px-4 text-stone-500 hover:text-stone-700">
              <svg id="icon-eye" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="h-5 w-5">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Buttons -->
        <button id="save-token-btn" type="button" class="w-full mt-2 rounded-xl bg-primary px-4 py-3 text-sm font-semibold text-white hover:bg-primary-container transition">
          Masuk
        </button>

        <button id="clear-token-btn" type="button" class="w-full rounded-xl bg-stone-100 px-4 py-3 text-sm font-semibold text-stone-700 hover:bg-stone-200 transition">
          Hapus Token Tersimpan
        </button>

        <p id="login-msg" class="text-sm hidden mt-2"></p>
      </div>
    </div>
  </div>

  <script>
    // GANTI URL INI dengan URL Web App (Deployment) terbaru Anda
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwT_rKDh46m7hyl0wWlcN2TflR-2VoOjRsYpIZT51-jxodGTUJgNYYrCsG5QKGK5Q4cbw/exec";
    const KEY_ADMIN_ID = "manupi_adminId";
    const KEY_TOKEN = "manupi_adminToken";

    const adminIdEl = document.getElementById("admin-id");
    const tokenEl = document.getElementById("admin-token");
    const msgEl = document.getElementById("login-msg");
    const loginBtn = document.getElementById("save-token-btn");

    function showMsg(text, type = "success") {
      msgEl.textContent = text;
      msgEl.className = "text-sm mt-2 " + (type === "error" ? "text-red-600" : type === "process" ? "text-stone-500" : "text-emerald-700");
      msgEl.classList.remove("hidden");
    }

    const savedId = localStorage.getItem(KEY_ADMIN_ID);
    if (savedId) adminIdEl.value = savedId;

    // VERIFIKASI LOGIN JSONP
    loginBtn.addEventListener("click", () => {
      const adminId = adminIdEl.value.trim();
      const token = tokenEl.value.trim();

      if (!adminId || !token) return showMsg("ID dan Token wajib diisi.", "error");

      loginBtn.disabled = true;
      loginBtn.textContent = "Memverifikasi...";
      showMsg("Menghubungi server...", "process");

      const callbackName = 'jsonp_' + Math.round(100000 * Math.random());
      window[callbackName] = function(data) {
        delete window[callbackName];
        const scriptTags = document.querySelectorAll('script[data-jsonp]');
        scriptTags.forEach(s => s.remove());
        
        if (data.ok) {
          localStorage.setItem(KEY_ADMIN_ID, adminId);
          localStorage.setItem(KEY_TOKEN, token);
          showMsg("Akses diterima. Membuka panel...");
          setTimeout(() => { location.href = "admin.html"; }, 500);
        } else {
          showMsg("ID atau Token salah. Akses ditolak!", "error");
          loginBtn.disabled = false;
          loginBtn.textContent = "Masuk";
        }
      };

      const script = document.createElement('script');
      script.setAttribute('data-jsonp', 'true');
      script.src = `${SCRIPT_URL}?action=ping&adminId=${encodeURIComponent(adminId)}&token=${encodeURIComponent(token)}&callback=${callbackName}`;
      document.body.appendChild(script);
    });

    document.getElementById("toggle-token-visibility").addEventListener("click", () => {
      tokenEl.type = tokenEl.type === "password" ? "text" : "password";
    });

    document.getElementById("clear-token-btn").addEventListener("click", () => {
      localStorage.clear();
      adminIdEl.value = ""; tokenEl.value = "";
      showMsg("Data tersimpan dihapus.");
    });
  </script>
</body>
</html>
