<!DOCTYPE html>
<html lang="id" class="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk Kerabat – Manupi</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  
  <!-- KONFIGURASI WARNA MANUPI -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#013a13",
            "primary-container": "#1e5128",
            "on-primary": "#ffffff",
            "surface-container": "#f0edea",
            "background": "#fcf9f6",
            "on-background": "#1c1c1a",
          },
          fontFamily: {
            "headline": ["Newsreader", "serif"],
            "body": ["Manrope", "sans-serif"],
          }
        }
      }
    }
  </script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet" />

  <style>
    /* CSS sederhana untuk menyembunyikan panah pada input number */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>

<body class="bg-background text-on-background font-body min-h-screen flex flex-col">

  <!-- HEADER SIMPLE -->
  <header class="py-6 px-6 w-full max-w-md mx-auto">
    <a href="index.html" class="inline-flex items-center gap-2 text-stone-500 hover:text-primary transition-colors text-sm font-semibold uppercase tracking-widest">
      <span class="material-symbols-outlined text-lg">arrow_back</span>
      Halaman Utama
    </a>
  </header>

  <!-- MAIN LOGIN AREA -->
  <main class="flex-grow flex items-center justify-center px-6 pb-12">
    <div class="w-full max-w-md">
      
      <!-- LOGO & TITLE -->
      <div class="text-center mb-10">
        <img alt="Manupi Logo" class="h-16 mx-auto mb-6 object-contain" src="assets/images/logo.png" onerror="this.style.display='none'" />
        <h1 class="text-4xl font-serif text-primary mb-2">Masuk Ruang Tamu</h1>
        <p class="text-sm text-stone-500 leading-relaxed">
          Masukkan nomor WhatsApp dan PIN Anda untuk melihat ID Kerabat dan Riwayat Kunjungan.
        </p>
      </div>

      <!-- FORM -->
      <div class="bg-white rounded-[2rem] border border-stone-200 p-6 md:p-8 shadow-sm">
        <div class="space-y-5">
          
          <!-- No WhatsApp -->
          <div>
            <label for="member-phone" class="block text-xs uppercase tracking-widest font-bold text-stone-400 mb-2">No. WhatsApp</label>
            <input id="member-phone" type="number" placeholder="Contoh: 0812..." class="w-full rounded-xl border border-stone-200 bg-surface-container px-4 py-3.5 text-sm focus:border-primary focus:bg-white focus:ring-1 focus:ring-primary outline-none transition-all" />
          </div>

          <!-- PIN -->
          <div>
            <label for="member-pin" class="block text-xs uppercase tracking-widest font-bold text-stone-400 mb-2">PIN Rahasia</label>
            <div class="relative">
              <input id="member-pin" type="password" placeholder="Masukkan PIN..." class="w-full rounded-xl border border-stone-200 bg-surface-container px-4 py-3.5 pr-12 text-sm focus:border-primary focus:bg-white focus:ring-1 focus:ring-primary outline-none transition-all" />
              <button id="toggle-pin-visibility" type="button" class="absolute inset-y-0 right-0 flex items-center justify-center px-4 text-stone-400 hover:text-stone-700">
                <span id="icon-eye" class="material-symbols-outlined text-xl">visibility</span>
              </button>
            </div>
          </div>

          <!-- Pesan Error/Sukses -->
          <p id="login-msg" class="text-xs text-center hidden font-medium px-2"></p>

          <!-- Button Login -->
          <button id="login-btn" type="button" class="w-full mt-2 rounded-xl bg-primary px-4 py-4 text-sm font-bold tracking-widest uppercase text-white hover:bg-primary-container transition-all active:scale-[0.98]">
            Masuk Kerabat
          </button>
          
        </div>
      </div>

      <!-- LINK DAFTAR / KLAIM AKUN -->
      <div class="mt-8 text-center">
        <p class="text-sm text-stone-500 mb-2">Belum memiliki PIN atau Akun baru?</p>
        <a href="member-register.html" class="text-sm font-bold text-primary hover:underline uppercase tracking-widest inline-flex items-center gap-1">
          Klaim / Daftar Akun <span class="material-symbols-outlined text-sm">arrow_forward</span>
        </a>
      </div>

    </div>
  </main>

  <script>
    // ====================================================================
    // GANTI URL DI BAWAH INI DENGAN URL WEB APP DARI APPS SCRIPT UJI COBA
    // ====================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxkZF_BzMKra69DLhr64DGwNw_YkT9pyWeflG_8GH1q4RA5pMgM127vMaP6fHMBATX9/exec"; 
    
    // Konfigurasi Penyimpanan Lokal (Local Storage)
    const KEY_MEMBER_ID = "manupi_memberId";
    const KEY_MEMBER_NAME = "manupi_memberName";
    const KEY_MEMBER_PHONE = "manupi_memberPhone";

    const phoneEl = document.getElementById("member-phone");
    const pinEl = document.getElementById("member-pin");
    const msgEl = document.getElementById("login-msg");
    const loginBtn = document.getElementById("login-btn");
    const toggleEyeBtn = document.getElementById("toggle-pin-visibility");
    const iconEye = document.getElementById("icon-eye");

    // Fungsi Toggle Tampil PIN
    toggleEyeBtn.addEventListener("click", () => {
      if (pinEl.type === "password") {
        pinEl.type = "text";
        iconEye.textContent = "visibility_off";
      } else {
        pinEl.type = "password";
        iconEye.textContent = "visibility";
      }
    });

    // Fungsi Tampil Pesan
    function showMsg(text, type = "success") {
      msgEl.textContent = text;
      if(type === "error") {
        msgEl.className = "text-xs text-center font-medium px-2 text-red-600";
      } else if (type === "process") {
        msgEl.className = "text-xs text-center font-medium px-2 text-stone-500 animate-pulse";
      } else {
        msgEl.className = "text-xs text-center font-medium px-2 text-primary";
      }
      msgEl.classList.remove("hidden");
    }

    // Aksi Klik Tombol Login
    loginBtn.addEventListener("click", async () => {
      const phone = phoneEl.value.trim();
      const pin = pinEl.value.trim();

      if (!phone || !pin) return showMsg("Nomor WhatsApp dan PIN wajib diisi.", "error");

      // Mengubah state tombol saat memproses
      loginBtn.disabled = true;
      loginBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-lg align-middle mr-2">progress_activity</span> Memproses...';
      showMsg("Menghubungi server Manupi...", "process");

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            action: 'loginMember',
            payload: { phone, pin }
          })
        });

        const result = await response.json();

        if (result.ok) {
          showMsg("Akses diterima! Mengalihkan ke Dasbor...", "success");
          
          // Simpan data ke browser agar tetap login
          localStorage.setItem(KEY_MEMBER_ID, result.data.memberId);
          localStorage.setItem(KEY_MEMBER_NAME, result.data.name);
          localStorage.setItem(KEY_MEMBER_PHONE, result.data.phone);

          // Alihkan ke Dasbor Pelanggan dalam 1 detik
          setTimeout(() => {
            window.location.href = "member-dashboard.html";
          }, 1000);
        } else {
          showMsg(result.error || "Gagal masuk. Periksa kembali No WhatsApp atau PIN.", "error");
          loginBtn.disabled = false;
          loginBtn.textContent = "Masuk Kerabat";
        }
      } catch (error) {
        showMsg("Terjadi kesalahan jaringan. Coba lagi.", "error");
        loginBtn.disabled = false;
        loginBtn.textContent = "Masuk Kerabat";
      }
    });
  </script>
</body>
</html>
