<!DOCTYPE html>
<html class="light" lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Rumah Kopi Manupi</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="assets/css/tailwind-config.js"></script>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader&family=Manrope&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />

  <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body class="bg-background text-on-background">

<main class="max-w-7xl mx-auto px-4 md:px-8 py-8 md:py-12">

<!-- ================= LEADERBOARD ================= -->
<section class="pb-20 md:pb-24">

  <div class="mb-6">
    <span class="uppercase tracking-[0.22em] text-[10px] text-secondary font-semibold block mb-3">
      The Greenhouse Circle
    </span>
    <h2 class="font-serif text-4xl md:text-5xl text-primary">
      Community<br>Leaderboard
    </h2>
  </div>

  <!-- Search -->
  <div class="mb-6">
    <input id="lb-search"
      type="text"
      placeholder="Find a Member..."
      class="w-full rounded-xl border border-stone-200 bg-white/70 py-3 px-4 text-sm">
  </div>

  <!-- Rank 1 -->
  <div class="rounded-3xl bg-primary p-6 text-white shadow mb-5 text-center">
    <h3 id="lb-featured-name" class="font-serif text-3xl">-</h3>
    <p id="lb-featured-id" class="text-xs tracking-widest mt-1">-</p>
    <p id="lb-featured-meta" class="text-xs tracking-widest mt-2">Rank 1 • 0 pts</p>
  </div>

  <!-- Rank 2–3 -->
  <div class="grid grid-cols-2 gap-4 mb-6">
    <div class="bg-stone-100 p-4 rounded-xl text-center">
      <h4 id="lb-2-name">-</h4>
      <p id="lb-2-id" class="text-xs text-stone-400">-</p>
      <p id="lb-2-meta" class="text-xs text-stone-400">Rank 2 • 0 pts</p>
    </div>

    <div class="bg-stone-100 p-4 rounded-xl text-center">
      <h4 id="lb-3-name">-</h4>
      <p id="lb-3-id" class="text-xs text-stone-400">-</p>
      <p id="lb-3-meta" class="text-xs text-stone-400">Rank 3 • 0 pts</p>
    </div>
  </div>

  <!-- Rank 4–10 -->
  <div class="rounded-xl border border-stone-200 bg-white/80 overflow-hidden">
    <div class="px-5 py-3 text-xs uppercase tracking-widest text-stone-400">
      Top Contributors
    </div>

    <p id="lb-status" class="px-5 py-3 text-xs text-stone-400 hidden"></p>
    <div id="lb-top-list" class="divide-y divide-stone-200"></div>
  </div>

</section>

</main>

<script src="assets/js/leaderboard.js?v=1"></script>
</body>
</html>
