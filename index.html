            "primary-fixed": "#b8f1b9",

            "secondary-fixed": "#f6decb",

            "on-background": "#1c1c1a",
            "primary-container": "#1e5128",
            "on-primary": "#ffffff",
            "surface-container": "#f0edea",
            "surface": "#fcf9f6",
            "background": "#fcf9f6",

<body class="bg-background text-on-background antialiased">
  
  <nav class="bg-stone-50/80 backdrop-blur-xl text-emerald-900 docked full-width top-0 sticky z-50">
    <div class="flex justify-between items-center w-full px-6 md:px-8 py-4 max-w-7xl mx-auto">
      <a href="index.html" class="flex items-center gap-3">
        <img alt="Manupi Logo" class="h-10 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/ADBb0uhsXxeUU02h6HZwie_MnViGgZcANQ1f6viviAu6Nd1Oda3gancN8Krnm1Qo0SWx-gyTp9CzixgdTLdB9tyGCRR4AMfq4I2EgTiP8vglIus5A2PlKWmTzKoRM696XSYYF2uyMsngKavMQwtDHzLCJD8GoLqFjHdrc-bs260f9GFvNPue2dulGpKvLHggL6GlHKyg6ieO0QQ3CadnkibagrHrNwln_rGkobhBio-nBuXm0KX2r6MKaosbedmdEFgXz4vQHiQQT8UyHhg" />
        <span class="text-xl md:text-2xl font-serif italic text-emerald-900">Manupi</span>
      </a>
      <div class="hidden md:flex items-center gap-8 text-xs font-bold uppercase tracking-widest font-label">
        <a class="text-emerald-900 border-b border-emerald-900 pb-1" href="index.html">Home</a>
        <a class="text-stone-500 hover:text-emerald-800" href="menu.html">Menu</a>
        <a class="text-stone-500 hover:text-emerald-800" href="location.html">Location</a>
      </div>
    </div>
  </nav>

  <main>
    <section class="relative min-h-[70vh] flex items-center overflow-hidden px-8">
      <div class="absolute inset-0 z-0">
        <div class="absolute inset-0 bg-gradient-to-r from-background via-background/40 to-transparent z-10"></div>
        <img class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCWPbA5v8EUep8FUpI2ITuNqnjJfftorRdSi_300__cPKU77Ik5K0hfvljgxaqNYxmIpH1DtJKk5Q8TfyssmiPMbsmpPwcnal8qI8GvjUyQs7nHxg2HBrGDE-qg9ghcl1UcelOI3CT2KZRgrg6mXaC-UyII2miDWTd5db4ayccpNvlA_as-NVzyWn_21Llxmten9pa1O9bHDaGnWgx5aPA9662y6pgN3ELxNTwnUNws8uHnbw5_oDViwbqLGwsbyx8dGNANyVrmdn9B" />
      </div>
      
      <div class="relative z-20 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-12 py-12">
        <div class="flex flex-col items-start gap-6">
          <span class="font-label uppercase tracking-[0.2em] text-xs text-primary font-bold">The Digital Greenhouse</span>
          <h1 class="font-serif text-5xl md:text-7xl leading-[0.9] tracking-tight text-primary">A breath of fresh coffee.</h1>
          <p class="font-body text-base md:text-lg text-secondary max-w-md leading-relaxed">
            An organic escape in the heart of Banjarbaru. Experience the transition from city bustle to lush garden serenity.
          </p>

          <div class="bg-white p-6 rounded-[2.5rem] shadow-xl w-full max-w-sm border border-stone-100 mt-4">
            <div class="flex items-center gap-3 mb-5">
              <div class="w-10 h-10 rounded-full bg-primary/5 flex items-center justify-center text-primary">
                <span class="material-symbols-outlined">loyalty</span>
              </div>
              <h3 class="font-serif text-xl text-primary italic">Cek Poin Member</h3>
            </div>
            
            <div class="space-y-3">
              <input id="check-points-input" type="text" placeholder="Nama atau ID (RKM...)" 
                class="w-full px-5 py-4 bg-stone-50 border border-stone-100 rounded-2xl text-sm focus:ring-2 focus:ring-primary/10 outline-none font-body transition-all">
              <button id="btn-check-points" class="w-full bg-primary text-white py-4 rounded-2xl font-bold text-sm transition-all hover:brightness-110 active:scale-95 shadow-lg shadow-primary/20">
                Lihat Keuntungan Saya
              </button>
            </div>

            <div id="check-result" class="hidden mt-6 pt-6 border-t border-stone-100 animate-in fade-in slide-in-from-top-4 duration-500">
              <div class="text-center">
                <h4 id="res-name" class="font-serif text-2xl italic text-primary"></h4>
                <p id="res-id" class="font-label text-[10px] uppercase tracking-widest text-stone-400 mt-1 mb-5"></p>
                
                <div class="grid grid-cols-2 gap-3">
                  <div class="bg-stone-50 p-4 rounded-3xl">
                    <span class="text-[8px] font-bold text-stone-400 uppercase tracking-tighter block mb-1">Total Poin</span>
                    <span id="res-points" class="text-2xl font-bold text-primary">0</span>
                  </div>
                  <div class="bg-stone-50 p-4 rounded-3xl">
                    <span class="text-[8px] font-bold text-stone-400 uppercase tracking-tighter block mb-1">Peringkat</span>
                    <span id="res-rank" class="text-2xl font-bold text-primary">-</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="py-20 px-8 max-w-7xl mx-auto">
      <div class="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">
        <div>
          <span class="font-label uppercase tracking-widest text-xs text-secondary">The Greenhouse Circle</span>
          <h2 class="font-serif text-4xl text-primary mt-2">Community Leaderboard</h2>
        </div>
        <div class="relative w-full md:w-80">
          <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-stone-400">search</span>
          <input id="search-member" class="w-full pl-12 pr-6 py-4 bg-surface-container-low border-none rounded-2xl focus:ring-2 focus:ring-primary/10 text-sm font-body" placeholder="Find a member..." type="text" />
        </div>
      </div>
      
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-10">
        <div id="podium-container" class="lg:col-span-4 space-y-4">
          </div>
        <div class="lg:col-span-8">
          <div class="bg-white rounded-[2.5rem] border border-stone-100 shadow-sm overflow-hidden">
            <div id="list-container" class="divide-y divide-stone-50">
              </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbwT_rKDh46m7hyl0wWlcN2TflR-2VoOjRsYpIZT51-jxodGTUJgNYYrCsG5QKGK5Q4cbw/exec?action=publicLeaderboard';
    let allLeaderboardData = [];

    // Fungsi Ambil Data
    async function fetchLeaderboard() {
      try {
        const response = await fetch(API_URL);
        const result = await response.json();
        if (result.ok && result.data) {
          allLeaderboardData = result.data.map((item, index) => ({ 
            ...item, 
            rank: index + 1,
            imageUrl: `https://ui-avatars.com/api/?name=${encodeURIComponent(item.name)}&background=f0edea&color=013a13&bold=true`
          }));
          renderLeaderboard(allLeaderboardData);
        }
      } catch (error) { console.error('Error fetching:', error); }
    }

    // LOGIKA PENCARIAN PADA KOLOM CEK POIN (KARTU PUTIH)
    document.getElementById('btn-check-points').addEventListener('click', () => {
      const input = document.getElementById('check-points-input').value.trim().toLowerCase();
      const resultDiv = document.getElementById('check-result');
      
      if (!input) {
        alert("Silakan masukkan Nama atau ID Member.");
        return;
      }

      // Mencari member berdasarkan Nama atau ID Member
      const member = allLeaderboardData.find(m => 
        m.name.toLowerCase().includes(input) || 
        m.memberId.toLowerCase() === input
      );

      if (member) {
        resultDiv.classList.remove('hidden');
        document.getElementById('res-name').textContent = member.name;
        document.getElementById('res-id').textContent = member.memberId;
        document.getElementById('res-points').textContent = member.totalPoints;
        document.getElementById('res-rank').textContent = member.rank;
      } else {
        alert("Member tidak ditemukan. Pastikan data yang dimasukkan benar.");
        resultDiv.classList.add('hidden');
      }
    });

    // RENDER UI LEADERBOARD
    function renderLeaderboard(data) {
      const podium = document.getElementById('podium-container');
      const list = document.getElementById('list-container');
      
      // Podium Logic (Top 3)
      if(data[0]) {
        podium.innerHTML = `
          <div class="bg-primary p-8 rounded-[2.5rem] text-center text-white shadow-xl relative overflow-hidden">
            <div class="relative z-10 flex flex-col items-center">
              <span class="material-symbols-outlined text-tertiary-fixed text-4xl mb-2">workspace_premium</span>
              <img class="w-24 h-24 rounded-full border-4 border-tertiary-fixed p-1 mb-4 bg-white" src="${data[0].imageUrl}" />
              <h3 class="font-serif text-2xl italic">${data[0].name}</h3>
              <p class="text-[10px] font-label opacity-60 uppercase tracking-widest mt-1">${data[0].memberId}</p>
              <div class="mt-4 bg-white/10 px-4 py-1 rounded-full text-[10px] font-bold">RANK 1 • ${data[0].totalPoints} PTS</div>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-4">
            ${[data[1], data[2]].map((m, i) => m ? `
              <div class="bg-surface-container rounded-3xl p-5 text-center border border-stone-100">
                <img class="w-12 h-12 mx-auto rounded-full mb-3" src="${m.imageUrl}" />
                <h4 class="font-serif text-sm text-primary truncate">${m.name}</h4>
                <p class="text-[8px] font-bold text-secondary uppercase tracking-tighter mt-1">RANK ${i+2} • ${m.totalPoints} PTS</p>
              </div>
            ` : '').join('')}
          </div>
        `;
      }

      // List Logic (Rest)
      list.innerHTML = data.slice(3, 10).map(m => `
        <div class="px-8 py-5 flex items-center justify-between hover:bg-stone-50 transition-colors">
          <div class="flex items-center gap-5">
            <span class="font-serif text-xl text-stone-300 w-6 italic">${m.rank}</span>
            <div class="flex items-center gap-4">
              <img class="w-10 h-10 rounded-full" src="${m.imageUrl}" />
              <div>
                <h5 class="font-bold text-primary text-sm">${m.name}</h5>
                <p class="text-[10px] text-stone-400 uppercase tracking-widest">${m.memberId}</p>
              </div>
            </div>
          </div>
          <div class="text-right">
            <span class="font-bold text-primary text-sm block">${m.totalPoints} pts</span>
          </div>
        </div>
      `).join('');
    }

    // Search Leaderboard Real-time (Filter Bawah)
    document.getElementById('search-member').addEventListener('input', (e) => {
      const val = e.target.value.toLowerCase();
      const filtered = allLeaderboardData.filter(m => m.name.toLowerCase().includes(val) || m.memberId.toLowerCase().includes(val));
      renderLeaderboard(filtered);
    });

    document.addEventListener('DOMContentLoaded', fetchLeaderboard);
  </script>

</body>
</html>
